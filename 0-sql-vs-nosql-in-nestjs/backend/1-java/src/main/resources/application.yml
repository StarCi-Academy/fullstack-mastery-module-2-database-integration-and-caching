spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:starci_sql_db}
    username: ${POSTGRES_USER:starci_user}
    password: ${POSTGRES_PASSWORD:starci_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://starci_admin:starci_password@localhost:27017/starci_nosql_db?authSource=admin}

server:
  port: 3000
